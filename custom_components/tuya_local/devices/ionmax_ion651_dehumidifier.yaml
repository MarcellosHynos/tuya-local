name: Dehumidifier air purifier
products:
  - id: ziw6iyj4cdhxez8a
    manufacturer: Ionmax
    model: Rhine Pro ION651
entities:
  - entity: humidifier
    class: dehumidifier
    translation_key: extended
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: string
        name: humidity
        range:
          min: 40
          max: 50
        mapping:
          - step: 10
      - id: 5
        type: string
        name: mode
        mapping:
          - dps_val: Manual
            value: normal
          - dps_val: Laundry
            value: laundry
          - dps_val: Night
            value: sleep
          - dps_val: Auto
            value: auto
      - id: 6
        type: integer
        name: current_humidity
  - entity: sensor
    class: temperature
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    class: humidity
    dps:
      - id: 6
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: sensor
    class: pm25
    dps:
      - id: 15
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    name: Air quality
    icon: "mdi:air-filter"
    dps:
      - id: 103
        type: string
        name: sensor
        optional: true
  - entity: switch
    name: Swing
    icon: "mdi:arrow-oscillating"
    dps:
      - id: 8
        type: boolean
        name: switch
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 16
        type: boolean
        name: lock
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 17
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 18
        type: integer
        name: sensor
        unit: min
        class: measurement
  - entity: binary_sensor
    translation_key: tank_full
    category: diagnostic
    dps:
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 1
            value: true
          - value: false
  - entity: binary_sensor
    translation_key: defrost
    category: diagnostic
    dps:
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 2
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: false
          - dps_val: 2
            value: false
          - value: true
      - id: 19
        type: bitfield
        name: fault_code
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 20
        type: boolean
        optional: true
        name: button
  - entity: select
    name: Operation mode
    icon: "mdi:air-purifier"
    dps:
      - id: 106
        type: string
        name: option
        mapping:
          - dps_val: Dehum
            value: Dehumidify + purify
          - dps_val: Air_Purifer
            value: Purify only
  - entity: select
    name: Fan speed
    icon: "mdi:fan"
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
          - dps_val: "4"
            value: "4"
  - entity: select
    name: Purifier mode
    icon: "mdi:air-filter"
    dps:
      - id: 104
        type: string
        name: option
        mapping:
          - dps_val: Manual
            value: Manual
          - dps_val: Night
            value: Silent
          - dps_val: Auto
            value: Auto
  - entity: select
    name: Purifier speed
    icon: "mdi:fan"
    dps:
      - id: 105
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
          - dps_val: "4"
            value: "4"
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 102
        type: boolean
        name: switch
